[project]
name = "brain"
version = "0.1.0"
description = "A second brain: a tiny harness with persistent memory."
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "openai>=3.42.0",
    "pydantic>=2.14.2",
]

# This is an app, not a library: no build step, just run the .py files.
[tool.uv]
package = false
