<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>atlas</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div id="app">

  <aside id="sidebar">
    <header class="side-head">
      <span class="logo">atlas</span>
      <button id="new-chat" title="new chat (⌘K)">+</button>
    </header>

    <input id="filter" placeholder="filter…" autocomplete="off" spellcheck="false" />

    <nav id="sessions" aria-label="saved chats"></nav>

    <footer class="side-foot">
      <div id="stats" class="stats"></div>
      <div id="model" class="model"></div>
    </footer>
  </aside>

  <main id="main">
    <header class="top">
      <button id="menu" class="menu" title="chats">≡</button>
      <h1 id="title">new chat</h1>
      <span id="mode-chip" class="chip">coach</span>
      <span class="spacer"></span>
      <select id="mode" title="mode"></select>
      <select id="model-pick" title="model"></select>
      <button id="settings" type="button" title="endpoint &amp; model">⚙</button>
      <span id="status" class="status"></span>
    </header>

    <section id="messages" aria-live="polite"></section>

    <form id="composer" autocomplete="off">
      <textarea id="input" rows="1" placeholder="message atlas…  ⏎ send · ⇧⏎ newline" spellcheck="false"></textarea>
      <button id="send" type="submit" title="send">↑</button>
      <button id="stop" type="button" title="stop" hidden>■</button>
    </form>
  </main>

</div>

<dialog id="configure">
  <form id="config-form">
    <h2>your model</h2>
    <p class="hint">Any OpenAI-compatible server: Ollama, LM Studio, llama.cpp,
      vLLM, OpenRouter, or a GPU box on your LAN. Saved to data/settings.json.</p>

    <label>endpoint
      <input id="cfg-url" placeholder="http://127.0.0.1:11434/v1" spellcheck="false" />
    </label>
    <label>api key <span class="opt">optional for local servers</span>
      <input id="cfg-key" type="password" placeholder="sk-…" spellcheck="false" />
    </label>
    <label>model
      <input id="cfg-model" list="cfg-models" placeholder="qwen2.5:3b" spellcheck="false" />
      <datalist id="cfg-models"></datalist>
    </label>

    <label>download <span class="opt">Ollama only</span>
      <span class="row">
        <input id="cfg-pull" placeholder="qwen2.5:7b" spellcheck="false" />
        <button type="button" id="cfg-pull-btn">pull</button>
      </span>
    </label>

    <p class="hint" id="cfg-status"></p>
    <menu>
      <button type="button" id="cfg-cancel">cancel</button>
      <button type="submit" id="cfg-save">save</button>
    </menu>
  </form>
</dialog>
<script src="/app.js"></script>
</body>
</html>
